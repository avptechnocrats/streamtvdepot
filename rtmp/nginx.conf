# ─────────────────────────────────────────────────────────────────────────────
#  SignalView – Nginx RTMP config
#
#  Port 1935 – RTMP ingest  (OBS → application live → ffmpeg → application hls)
#  Port 80   – HTTP HLS serving  (/hls/<key>.m3u8  &  /hls/<key>_720p.m3u8 …)
#
#  on_publish / on_publish_done call the FastAPI backend (service name "backend"
#  on the Docker bridge network) to validate stream keys and update is_live.
#
#  FFmpeg transcodes every incoming stream to 3 ABR qualities:
#    720p  @ 2500 kbps
#    480p  @ 1000 kbps
#    360p  @  500 kbps
#
#  The HLS master playlist (ABR) lives at:
#    /hls/<stream-key>.m3u8
#  Individual quality playlists at:
#    /hls/<stream-key>_720p.m3u8
#    /hls/<stream-key>_480p.m3u8
#    /hls/<stream-key>_360p.m3u8
# ─────────────────────────────────────────────────────────────────────────────

worker_processes auto;
error_log /logs/rtmp-error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

# ─── RTMP ─────────────────────────────────────────────────────────────────────
rtmp {
    server {
        listen 1935;
        chunk_size 4096;
        timeout 30s;

        # ── Input app: OBS / encoder pushes to rtmp://<host>/live/<key> ──────
        application live {
            live on;
            record off;

            # Validate stream key via SignalView backend before allowing stream.
            # Backend returns 2xx → stream allowed.
            # Backend returns 403 → stream dropped immediately.
            on_publish      http://backend:8000/api/v1/rtmp/on-publish;
            on_publish_done http://backend:8000/api/v1/rtmp/on-publish-done;

            # Allow the local FFmpeg transcoder to pull the stream; deny all external viewers
            allow play 127.0.0.1;
            deny play all;

            # Re-encode to 3 ABR qualities and push to the hls application.
            # $name is the stream key (e.g. sports-hd-aB3xK9mQ).
            exec ffmpeg -i rtmp://localhost/live/$name
                -c:v libx264 -preset veryfast -tune zerolatency
                    -b:v 2500k -maxrate 2500k -bufsize 5000k
                    -vf "scale=1280:720,format=yuv420p"
                    -c:a aac -b:a 128k -ar 44100
                    -f flv rtmp://localhost/hls/${name}_720p
                -c:v libx264 -preset veryfast -tune zerolatency
                    -b:v 1000k -maxrate 1000k -bufsize 2000k
                    -vf "scale=854:480,format=yuv420p"
                    -c:a aac -b:a 96k -ar 44100
                    -f flv rtmp://localhost/hls/${name}_480p
                -c:v libx264 -preset veryfast -tune zerolatency
                    -b:v 500k  -maxrate 500k  -bufsize 1000k
                    -vf "scale=640:360,format=yuv420p"
                    -c:a aac -b:a 64k  -ar 44100
                    -f flv rtmp://localhost/hls/${name}_360p
                2>>/logs/ffmpeg.log;
        }

        # ── HLS output app: receives transcoded streams from FFmpeg ───────────
        application hls {
            live on;
            record off;

            hls on;
            hls_path /var/hls;
            hls_fragment 2s;
            # Keep a 30-minute DVR window so viewers can pause and rewind while live.
            hls_playlist_length 1800s;
            hls_cleanup on;

            # ABR master playlist variant entries.
            # nginx-rtmp writes a master .m3u8 referencing these quality streams.
            hls_variant _720p BANDWIDTH=2628000,RESOLUTION=1280x720,CODECS="avc1.4d401f,mp4a.40.2";
            hls_variant _480p BANDWIDTH=1128000,RESOLUTION=854x480,CODECS="avc1.4d401f,mp4a.40.2";
            hls_variant _360p BANDWIDTH=564000,RESOLUTION=640x360,CODECS="avc1.4d401e,mp4a.40.2";

            # Only the local FFmpeg process may publish here
            allow publish 127.0.0.1;
            deny publish all;
        }
    }
}

# ─── HTTP ─────────────────────────────────────────────────────────────────────
http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log   /logs/rtmp-access.log;
    sendfile     on;
    tcp_nopush   on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;

        # ── HLS segment serving ───────────────────────────────────────────────
        # Segments written to /var/hls by nginx-rtmp above.
        # root /var means Nginx serves /var/hls at URL path /hls.
        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t                    ts;
            }
            root /var;

            # Never cache live segments
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma        "no-cache";
            add_header Expires       "0";

            # CORS – allow all origins so Video.js can fetch from any domain
            add_header Access-Control-Allow-Origin  "*";
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Allow-Headers "*";

            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        # ── Health check (used by docker-compose healthcheck) ─────────────────
        location /health {
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        # ── RTMP stats page (optional, remove in production if not needed) ────
        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet /stat.xsl;
        }
        location /stat.xsl {
            root /etc/nginx/;
        }
    }
}
