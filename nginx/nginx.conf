events {
    worker_connections 1024;
}


http {
    # Docker's embedded DNS keeps proxy targets valid after a service container
    # is recreated and receives a different bridge-network IP address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $request_uri $backend_upstream {
        default stv_backend:8000;
    }

    map $request_uri $rtmp_upstream {
        default stv_rtmp:80;
    }

    map $request_uri $frontend_upstream {
        default stv_frontend:3000;
    }

    # ── Helper: proxy headers (used in every server block) ──────────────────
    map $host $forwarded_host {
        default $host;
    }

    # ── Access logging: never persist query strings — playback/DRM tokens are
    # passed as ?token=... query params, and query strings live indefinitely in
    # disk-backed access logs. Log the path and whether a token was present,
    # not its value.
    map $arg_token $log_has_token {
        ""      "no";
        default "yes";
    }

    log_format safe '$remote_addr - [$time_local] "$request_method $uri" '
                     '$status $body_bytes_sent token=$log_has_token '
                     '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log safe;

    # ═══════════════════════════════════════════════════════════════════════════
    # 1.  console.streamtvdepot.com  — SAAS platform (API + marketing + admin panel)
    #
    #     In production: point A record for console.streamtvdepot.com → this server
    #     Locally: this block handles "localhost"
    # ═══════════════════════════════════════════════════════════════════════════
    server {
        listen 80;
        server_name console.streamtvdepot.com localhost;
        client_max_body_size 6G;

        # ── HLS live stream segments (proxied from rtmp container) ─────────
        location /hls/ {
            # Gate: deny HLS if the channel is disabled by the admin
            auth_request /internal/hls-auth;

            proxy_pass http://$rtmp_upstream/hls/;
            proxy_set_header Host $host;
            proxy_cache_bypass 1;
            proxy_no_cache 1;
        }

        # Internal auth sub-request — not accessible from outside
        location = /internal/hls-auth {
            internal;
            proxy_pass http://$backend_upstream/api/v1/rtmp/hls-auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
        }

        # ── All API traffic ──────────────────────────────────────────────────
        location /api/ {
            proxy_pass http://$backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_request_buffering off;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
        }

        # ── Swagger / ReDoc ──────────────────────────────────────────────────
        location ~ ^/(docs|redoc|openapi.json) {
            proxy_pass http://$backend_upstream;
            proxy_set_header Host $host;
        }

        # ── Next.js frontend ─────────────────────────────────────────────────
            # Frontend container (production)
        location / {
            proxy_pass http://$frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
