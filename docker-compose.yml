services:
  stv_postgres:
    image: postgres:16-alpine
    container_name: streamtvdepot_db
    command: >
      postgres
      -c idle_in_transaction_session_timeout=60000
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-streamtvdepot}
      POSTGRES_USER: ${POSTGRES_USER:-streamtvdepot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stvdepot_20_26}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-streamtvdepot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - streamtvdepot_net

  stv_pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    container_name: streamtvdepot_pgbouncer
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-streamtvdepot}:${POSTGRES_PASSWORD:-stvdepot_20_26}@stv_postgres:5432/${POSTGRES_DB:-streamtvdepot}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-300}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-20}
      RESERVE_POOL_SIZE: ${PGBOUNCER_RESERVE_POOL_SIZE:-5}
      RESERVE_POOL_TIMEOUT: ${PGBOUNCER_RESERVE_POOL_TIMEOUT:-5}
      CLIENT_IDLE_TIMEOUT: ${PGBOUNCER_CLIENT_IDLE_TIMEOUT:-300}
      SERVER_IDLE_TIMEOUT: ${PGBOUNCER_SERVER_IDLE_TIMEOUT:-120}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER:-streamtvdepot} -d ${POSTGRES_DB:-streamtvdepot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      stv_postgres:
        condition: service_healthy
    networks:
      - streamtvdepot_net

  stv_redis:
    image: redis:7-alpine
    container_name: streamtvdepot_redis
    networks:
      - streamtvdepot_net

  stv_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: streamtvdepot_backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-streamtvdepot}:${POSTGRES_PASSWORD:-stvdepot_20_26}@stv_pgbouncer:5432/${POSTGRES_DB:-streamtvdepot}?prepared_statement_cache_size=0
      DATABASE_POOL_MODE: queue
      DATABASE_POOL_SIZE: ${API_DATABASE_POOL_SIZE:-5}
      DATABASE_MAX_OVERFLOW: ${API_DATABASE_MAX_OVERFLOW:-5}
      DATABASE_POOL_TIMEOUT: ${DATABASE_POOL_TIMEOUT:-30}
      REDIS_URL: redis://stv_redis:6379
    volumes:
      - ./backend:/app
      - recordings_data:/recordings
    ports:
      - "8100:8000"
    depends_on:
      stv_postgres:
        condition: service_healthy
    networks:
      - streamtvdepot_net
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  stv_billing_celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-streamtvdepot}:${POSTGRES_PASSWORD:-stvdepot_20_26}@stv_pgbouncer:5432/${POSTGRES_DB:-streamtvdepot}?prepared_statement_cache_size=0
      DATABASE_POOL_MODE: null
      REDIS_URL: redis://stv_redis:6379
    volumes:
      - ./backend:/app
      - recordings_data:/recordings
    depends_on:
      stv_postgres:
        condition: service_healthy
      stv_redis:
        condition: service_started
    networks:
      - streamtvdepot_net
    command: celery -A app.core.celery_app.celery_app worker --loglevel=INFO --queues=billing --concurrency=${BILLING_WORKER_CONCURRENCY:-4} --max-tasks-per-child=1000

  stv_notification_celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-streamtvdepot}:${POSTGRES_PASSWORD:-stvdepot_20_26}@stv_pgbouncer:5432/${POSTGRES_DB:-streamtvdepot}?prepared_statement_cache_size=0
      DATABASE_POOL_MODE: null
      REDIS_URL: redis://stv_redis:6379
    volumes:
      - ./backend:/app
      - recordings_data:/recordings
    depends_on:
      stv_postgres:
        condition: service_healthy
      stv_redis:
        condition: service_started
    networks:
      - streamtvdepot_net
    command: celery -A app.core.celery_app.celery_app worker --loglevel=INFO --queues=notifications --concurrency=${NOTIFICATION_WORKER_CONCURRENCY:-4} --max-tasks-per-child=1000

  stv_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL
        - NEXT_PUBLIC_RTMP_SERVER_HOST
    container_name: streamtvdepot_frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_RTMP_SERVER_HOST: ${NEXT_PUBLIC_RTMP_SERVER_HOST}
    ports:
      - "3002:3000"
    depends_on:
      - stv_backend
    networks:
      - streamtvdepot_net

  stv_rtmp:
    build:
      context: ./rtmp
      dockerfile: Dockerfile
    platform: linux/amd64
    container_name: streamtvdepot_rtmp
    restart: unless-stopped
    ports:
      - "1936:1935"    # RTMP ingest — OBS connects here
    volumes:
      - hls_data:/var/hls
      - ./logs:/logs
    depends_on:
      - stv_backend
    networks:
      - streamtvdepot_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  stv_nginx:
    image: nginx:alpine
    container_name: streamtvdepot_nginx
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs:/logs
    depends_on:
      - stv_backend
      - stv_frontend
      - stv_rtmp
    networks:
      - streamtvdepot_net

volumes:
  postgres_data:
  hls_data:   # Shared between rtmp (writer) and nginx (future direct serve)
  recordings_data:

networks:
  streamtvdepot_net:
    driver: bridge
